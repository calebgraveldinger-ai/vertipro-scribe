<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VertiPro Ambient Scribe</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f8f9fa;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
      user-select: none;
    }
    .card {
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 300px;
      box-sizing: border-box;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #202124;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 24px;
    }
    .btn-record {
      background-color: #c5221f;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(197, 34, 31, 0.3);
      transition: all 0.2s ease;
    }
    .btn-record:hover {
      background-color: #a51d24;
      transform: translateY(-1px);
    }
    .btn-stop {
      background-color: #202124;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-stop:hover {
      background-color: #3c4043;
    }
    .timer {
      font-family: monospace;
      font-size: 24px;
      font-weight: 700;
      color: #c5221f;
      margin-bottom: 16px;
    }
    .wave-container {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 20px;
      margin-bottom: 20px;
    }
    .wave-bar {
      width: 4px;
      height: 8px;
      background-color: #c5221f;
      border-radius: 2px;
      animation: bounce 1s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.6s; }
    @keyframes bounce {
      0% { height: 6px; }
      100% { height: 22px; }
    }
    .status-note {
      font-size: 11px;
      color: #70757a;
      margin-top: 16px;
      line-height: 1.4;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <div style="display:flex; justify-content:center; margin-bottom:8px;">
      <span class="material-icons" style="font-size:32px; color:#c5221f;">mic</span>
    </div>
    <div class="title">Ambient Scribe Remote</div>
    <div class="sub">Encrypted in-memory audio capture</div>

    <!-- IDLE STATE -->
    <div id="idle-view">
      <button class="btn-record" onclick="startCapture()">
        <span class="material-icons">fiber_manual_record</span> Start Recording
      </button>
      <div class="status-note">Keep this window open alongside your note during the patient conversation.</div>
    </div>

    <!-- RECORDING STATE -->
    <div id="recording-view" class="hidden">
      <div class="timer" id="timer-display">00:00</div>
      <div class="wave-container">
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
      </div>
      <div>
        <button class="btn-stop" onclick="stopCapture()">
          <span class="material-icons">stop</span> Finish & Send
        </button>
      </div>
      <div class="status-note">Audio will automatically transfer into your Google Doc note when finished.</div>
    </div>

    <!-- PROCESSING/SENDING STATE -->
    <div id="sending-view" class="hidden">
      <div style="color:#1a73e8; margin-bottom:8px;">
        <span class="material-icons" style="font-size:32px; animation: spin 1s linear infinite;">sync</span>
      </div>
      <div style="font-size:13px; font-weight:700;">Transferring to EMR...</div>
      <div class="status-note">This window will close automatically.</div>
    </div>
  </div>

  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>

  <script>
    let mediaRecorder = null;
    let audioStream = null;
    let audioChunks = [];
    let timerInterval = null;
    let elapsedSeconds = 0;

    function startCapture() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          audioStream = stream;
          audioChunks = [];

          let mimeType = 'audio/webm';
          if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            mimeType = 'audio/webm;codecs=opus';
          } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            mimeType = 'audio/mp4';
          }

          try {
            mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
          } catch (e) {
            mediaRecorder = new MediaRecorder(stream);
          }

          mediaRecorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            
            // Release microphone hardware immediately
            if (audioStream) {
              audioStream.getTracks().forEach(t => t.stop());
              audioStream = null;
            }

            document.getElementById('recording-view').classList.add('hidden');
            document.getElementById('sending-view').classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = evt => {
              const base64Audio = evt.target.result.split(',')[1];
              
              // Post recorded audio buffer directly to the main EMR window
              if (window.opener) {
                window.opener.postMessage({
                  type: 'SCRIBE_AUDIO_PAYLOAD',
                  base64Audio: base64Audio,
                  mimeType: mediaRecorder.mimeType || 'audio/webm'
                }, '*');
              }
              
              setTimeout(() => { window.close(); }, 600);
            };
            reader.readAsDataURL(audioBlob);
          };

          mediaRecorder.start(1000);
          elapsedSeconds = 0;
          document.getElementById('timer-display').innerText = "00:00";
          timerInterval = setInterval(() => {
            elapsedSeconds++;
            const m = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const s = String(elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
          }, 1000);

          document.getElementById('idle-view').classList.add('hidden');
          document.getElementById('recording-view').classList.remove('hidden');
        })
        .catch(err => {
          alert("Microphone permission denied: " + err.message);
        });
    }

    function stopCapture() {
      if (timerInterval) clearInterval(timerInterval);
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }
  </script>
</body>
</html>
